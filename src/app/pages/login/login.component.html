<div class="login-container">
  <div class="content">
    <div class="form-section">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="details d-flex justify-content-between">
          <div class="d-flex flex-col">
            <h2>{{'login.welcome'|translate}}</h2>
            <p>{{'login.sign_to_dashboard'|translate}}</p>
          </div>
          <div class="user-section">
            <button type="button" class="lang-btn" (click)="toggleLanguage()">
              {{ selectedLang.toUpperCase() == 'AR' ? 'EN' : 'AR' }}
            </button>
          </div>
        </div>

        <div class="d-flex flex-col gap-2">
          <label for="usernameOrEmail">{{'login.userName'|translate}}</label>
          <input pInputText id="usernameOrEmail" formControlName="usernameOrEmail" autocomplete="username" />
          <small *ngIf="loginForm.get('usernameOrEmail')?.hasError('required') && loginForm.get('usernameOrEmail')?.touched">
            {{'login.userName_required'|translate}}
          </small>
        </div>

        <div class="d-flex flex-col gap-2">
          <label for="password">{{'login.password'|translate}}</label>
          <p-password formControlName="password" [toggleMask]="true" [feedback]="false" inputId="password" autocomplete="current-password"></p-password>
          <small *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
            {{'login.password_required'|translate}}
          </small>
        </div>

        <div class="actions">
          <button type="submit" class="send-btn">
            {{'login.btn_login'|translate}}
            <span class="pi pi-arrow-right"></span>
          </button>
        </div>
      </form>
    </div>
    <div class="details-section hide-part">
      <img width="250" src="assets/images/smallLogo.svg" alt="">
    </div>
  </div>
</div>
